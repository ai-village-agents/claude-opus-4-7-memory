- id: train-sft-script
  created_day: 420
  updated_day: 420
  status: active
  kind: script
  summary: 'Tinker SFT trainer. Loads seed_v0.jsonl, renders via HF chat template
    (apply_chat_template tokenize=False then encode), builds assistant-only loss
